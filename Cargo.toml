[package]
name = "quadfurn"
version = "0.1.0"
edition = "2021"
description = "3D Furniture & Cabinet CAD (4-viewport designer + guillotine sheet cutting optimizer)"
license = "MIT"
repository = "https://github.com/rbm13s/QuadFurn"
authors = ["rbm13s <rbm13s@gmail.com>"]
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
csv = "1.3"
ab_glyph = "0.2"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

