[package]
name = "quadfurn"
version = "0.2.3"
edition = "2021"
description = "3D Furniture & Cabinet CAD (4-viewport designer + guillotine sheet cutting optimizer)"
license = "MIT"
repository = "https://github.com/rbm13s/QuadFurn"
authors = ["rbm13s <rbm13s@gmail.com>"]
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
csv = "1.3"
ab_glyph = "0.2"
base64 = "0.22"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "accesskit", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "Location",
    "Navigator",
    "Url",
    "Window",
] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

